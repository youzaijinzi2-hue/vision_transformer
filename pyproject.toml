[project]
name = "vision-transformer"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Yuya Kaneko", email = "knkyy0509@g.ecc.u-tokyo.ac.jp" }
]
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "torch>=2.15.0",
    "torchvision>=0.29.2",
]

[project.scripts]
vision-transformer = "vision_transformer:main"

[build-system]
requires = ["uv_build>=0.11.26,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]
